name: CI/CD Docker ALTN71 2026

# Lancement manuel (workflow_dispatch) ou à chaque push sur main
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}

jobs:

  # Job 1 : compilation de la solution et lancement des tests unitaires
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Tests
        run: dotnet test --no-build

  # Job 2 : build et push des images via docker-compose.yml (seulement si les tests passent)
  docker:
    runs-on: ubuntu-latest
    needs: tests
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Construit les images des services ayant une section build (Auth, API, Gateway, Client)
      - name: Build images
        env:
          DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}
        run: docker compose build

      # Pousse ces images sur Docker Hub (postgres et keycloak sont des images publiques, non poussées)
      - name: Push images
        env:
          DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}
        run: docker compose push
